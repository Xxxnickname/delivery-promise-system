name: plan

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-plan}
      POSTGRES_USER: ${POSTGRES_USER:-plan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plan}
    volumes:
      - plan_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-plan} -d ${POSTGRES_DB:-plan}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    env_file: .env
    environment:
      APP_ENV: production
      APP_PORT: ${APP_PORT:-8003}
      DB_DSN: ${DB_DSN:-postgresql://plan:plan@postgres:5432/plan}
      DATABASE_URL: ${DB_DSN:-postgresql://plan:plan@postgres:5432/plan}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      AUTH_REQUIRED: "true"
      AUTH_SECRET: ${AUTH_SECRET:-change-me-in-production-use-32-bytes}
    ports:
      - "${APP_PORT:-8003}:8003"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build: .
    command: ["celery", "-A", "app.workers.celery_app.celery_app", "worker", "--loglevel=INFO"]
    env_file: .env
    environment:
      APP_ENV: production
      DB_DSN: ${DB_DSN:-postgresql://plan:plan@postgres:5432/plan}
      DATABASE_URL: ${DB_DSN:-postgresql://plan:plan@postgres:5432/plan}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      AUTH_REQUIRED: "true"
      AUTH_SECRET: ${AUTH_SECRET:-change-me-in-production-use-32-bytes}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  plan_pgdata:


