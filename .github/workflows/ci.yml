name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Compile Python
        run: python -m compileall -q app scripts eval migrations
      - name: JavaScript syntax
        run: |
          find app/static/js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Pytest
        run: pytest -q
      - name: G2 smoke
        run: python scripts/g2_check.py
      - name: 22 boundary checks
        run: python scripts/acceptance.py
      - name: Golden alignment
        run: python eval/run.py --golden
      - name: Compose config
        run: |
          cp .env.example .env
          docker compose config --quiet
